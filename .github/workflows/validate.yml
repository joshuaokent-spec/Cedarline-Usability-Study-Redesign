name: Validate research kit

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: node --check study-runner.js
      - name: Validate schema and HTML
        run: |
          python - <<'PY'
          import json
          from html.parser import HTMLParser

          json.load(open("templates/session-template.json", encoding="utf-8"))

          for filename in ("index.html", "study-runner.html"):
              class P(HTMLParser):
                  def __init__(self):
                      super().__init__()
                      self.ids = []
                      self.hrefs = []
                  def handle_starttag(self, tag, attrs):
                      d = dict(attrs)
                      if "id" in d:
                          self.ids.append(d["id"])
                      if d.get("href", "").startswith("#") and len(d["href"]) > 1:
                          self.hrefs.append(d["href"][1:])

              p = P()
              p.feed(open(filename, encoding="utf-8").read())
              assert len(p.ids) == len(set(p.ids)), f"Duplicate IDs in {filename}"
              assert not (set(p.hrefs) - set(p.ids)), f"Broken same-page anchors in {filename}"

          print("validation ok")
          PY
